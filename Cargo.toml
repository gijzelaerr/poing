[workspace]
resolver = "2"
members = ["app", "model", "engine"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/gijzelaerr/poing"

[workspace.dependencies]
poing-model = { path = "model" }
# Makepad 2.0 is not on crates.io. Pinned to a tag in gijzelaerr/makepad so the
# commit stays fetchable when upstream rewrites `work` (see CLAUDE.md).
makepad-widgets = { git = "https://github.com/gijzelaerr/makepad.git", tag = "poing-pin-20261024b" }
makepad-audio-decode = { git = "https://github.com/gijzelaerr/makepad.git", tag = "poing-pin-20261024b" }
makepad-micro-serde = { git = "https://github.com/gijzelaerr/makepad.git", tag = "poing-pin-20261024b" }
# Splash audio shaders: lane and master effects compiled to native code.
makepad-script-audio-aot = { git = "https://github.com/gijzelaerr/makepad.git", tag = "poing-pin-20261024b" }
# Poing as an AI service: tools an agent calls (makepad-remote mcp poing).
makepad-ai-services = { git = "https://github.com/gijzelaerr/makepad.git", tag = "poing-pin-20261024b" }
# poing-engine: native models (stems, beats, Whisper) on Makepad's ggml/CUDA/Metal
# runtime, in a helper process so poing itself never links CUDA.
makepad-ai-stems = { git = "https://github.com/gijzelaerr/makepad.git", tag = "poing-pin-20261024b" }
makepad-ai-beats = { git = "https://github.com/gijzelaerr/makepad.git", tag = "poing-pin-20261024b" }
makepad-ai-speech = { git = "https://github.com/gijzelaerr/makepad.git", tag = "poing-pin-20261024b", default-features = false, features = ["whisper"] }
# Its zlib, to spot Whisper stuck in a loop (as the sidecar does).
makepad-fast-inflate = { git = "https://github.com/gijzelaerr/makepad.git", tag = "poing-pin-20261024b" }
makepad-ai-hub = { git = "https://github.com/gijzelaerr/makepad.git", tag = "poing-pin-20261024b", default-features = false }
# poing-engine's language model (Qwen3.5 GGUF on ggml: CUDA/Metal).
makepad-ai-llm = { git = "https://github.com/gijzelaerr/makepad.git", tag = "poing-pin-20261024b" }
makepad-strict-json = { git = "https://github.com/gijzelaerr/makepad.git", tag = "poing-pin-20261024b" }
# The model manager unpacks a pinned source zip (ACE-Step) with it.
makepad-zip-file = { git = "https://github.com/gijzelaerr/makepad.git", tag = "poing-pin-20261024b" }
# poing-node: TLS to the Windows PC (self-signed, pinned) and sha256 for the bundle mirror.
makepad-network = { git = "https://github.com/gijzelaerr/makepad.git", tag = "poing-pin-20261024b" }
makepad-core-util = { git = "https://github.com/gijzelaerr/makepad.git", tag = "poing-pin-20261024b" }

# Makepad's own profiles: line tables for printf debugging, incremental release.
[profile.dev]
debug = "line-tables-only"

[profile.release]
incremental = true
lto = "off"
