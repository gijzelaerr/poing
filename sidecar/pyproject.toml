[project]
name = "poing-sidecar"
version = "0.1.0"
description = "Poing analysis sidecar: stems (Demucs), structure/key/chords/beats (SheetSage2), lyrics (Whisper)"
requires-python = ">=3.11,<3.12"
dependencies = [
    # SheetSage2's pinned stack (m-a-p/SheetSage2 requirements.txt)
    "torch==2.8.0",
    "torchaudio==2.8.0",
    "transformers==4.45.2",
    "huggingface-hub==0.36.0",
    "safetensors==0.5.3",
    "numpy==1.24.3",
    "scipy==1.13.1",
    "mir_eval==0.8.2",
    "pretty_midi==0.2.10",
    "mido==1.3.3",
    "setuptools==78.1.1",
    # stems, audio io
    "demucs==4.0.1",
    "soundfile",
    "librosa",
]

[tool.uv.sources]
torch = { index = "pytorch-cu126", marker = "sys_platform != 'darwin'" }
torchaudio = { index = "pytorch-cu126", marker = "sys_platform != 'darwin'" }

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true
