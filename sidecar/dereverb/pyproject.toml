[project]
name = "poing-dereverb"
version = "0.1.0"
description = "Poing vocal de-reverb: UVR mel-band roformer via audio-separator (own env: it needs numpy 2, SheetSage2 pins 1.24)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch==2.8.0",
    "numpy<2.3",
    "soundfile",
    "audioread>=3.1.0",  # audio-separator imports it without declaring it
    # the onnx GPU runtime has no macOS build; the roformer runs on torch either way
    "audio-separator[gpu]>=0.45.0; sys_platform != 'darwin'",
    "audio-separator>=0.45.0; sys_platform == 'darwin'",
]

[tool.uv.sources]
torch = { index = "pytorch-cu126", marker = "sys_platform != 'darwin'" }

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true
